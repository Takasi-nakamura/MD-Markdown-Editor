<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="シンプルで使いやすい Markdown エディター">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>MD Editor</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--panel:#fff;--text:#1d1d1f;--muted:#777;--line:#e5e5e7;--accent:#111;--soft:#f0f0f2;--shadow:0 8px 30px #00000012;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #737373;outline-offset:2px}
.app{min-height:100dvh;display:flex;flex-direction:column}.topbar{height:64px;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.4px;white-space:nowrap}.brand img{width:32px;height:32px}.docname{border:0;background:transparent;min-width:80px;max-width:280px;font-size:14px;padding:8px;border-radius:8px;color:var(--text)}.docname:hover{background:var(--soft)}.top-spacer{flex:1}.status{font-size:12px;color:var(--muted);white-space:nowrap}.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}.btn:hover{background:var(--soft)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.icon{width:36px;height:36px;padding:0;font-size:17px}.workspace{width:min(1160px,100%);margin:0 auto;padding:24px;flex:1;display:flex;flex-direction:column;gap:14px}.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.toolgroup{display:flex;gap:4px}.tool{min-width:34px;height:34px;padding:0 9px;border:0;border-radius:8px;background:transparent;font-weight:600}.tool:hover,.tool.active{background:var(--soft)}.tool.sep{font-weight:400;color:var(--line);padding:0 2px;pointer-events:none}.tool-label{font-size:12px;font-weight:500}.editor-card{flex:1;min-height:500px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.editor-head{height:46px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);gap:16px}.tab{height:100%;display:flex;align-items:center;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}.tab.selected{color:var(--text);border-color:var(--text);font-weight:600}.editor-area{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:450px}.pane{position:relative;min-width:0;display:flex;flex-direction:column}.pane+.pane{border-left:1px solid var(--line)}.pane-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:15px 22px 0}.editor-wrap{position:relative;flex:1;display:flex;flex-direction:column}.editor{width:100%;height:100%;min-height:400px;flex:1;min-width:0;resize:none;border:0;outline:0!important;background:transparent;color:var(--text);padding:18px 24px 70px;font:15px/1.85 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}.preview{padding:20px 26px 60px;overflow-wrap:anywhere;line-height:1.8;font-size:15px}.preview h1,.preview h2,.preview h3{line-height:1.35;letter-spacing:-.5px}.preview h1{font-size:2em;border-bottom:1px solid var(--line);padding-bottom:.3em}.preview h2{font-size:1.55em;border-bottom:1px solid var(--line);padding-bottom:.25em}.preview h3{font-size:1.25em}.preview blockquote{border-left:3px solid var(--line);margin:1em 0;padding:.1em 1em;color:var(--muted)}.preview pre{overflow:auto;max-width:100%;background:var(--soft);padding:14px;border-radius:10px;white-space:pre;overscroll-behavior-x:contain}.preview code{background:var(--soft);padding:2px 5px;border-radius:4px;font-size:.9em;overflow-wrap:anywhere}.preview pre code{padding:0;background:none;overflow-wrap:normal;word-break:normal}.preview p{margin:.65em 0}.preview ul,.preview ol{padding-left:1.5em}.preview li{margin:.2em 0}.preview input[type=checkbox]{accent-color:var(--text)}.preview .task{list-style:none;margin-left:-1.35em}.preview a{overflow-wrap:anywhere}.preview a{color:inherit}.preview table{border-collapse:collapse;width:100%;display:block;overflow:auto}.preview th,.preview td{border:1px solid var(--line);padding:7px 10px;text-align:left}.preview img{max-width:100%;height:auto}.preview hr{border:0;border-top:1px solid var(--line)}.add-wrap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:3}.add-button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);box-shadow:0 3px 14px #00000016;font-size:22px;line-height:1}.add-menu,.selection-menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:6px;box-shadow:0 12px 36px #00000022;display:none;min-width:190px;max-width:calc(100vw - 20px)}.add-menu.open,.selection-menu.open{display:flex;flex-wrap:wrap;gap:3px}.add-menu{flex-direction:column}.menu-item{border:0;background:transparent;border-radius:8px;padding:9px 11px;text-align:left;font-size:13px;white-space:nowrap}.menu-item:hover{background:var(--soft)}.selection-menu{gap:2px;padding:5px;flex-wrap:nowrap;overflow-x:auto}.selection-menu button{border:0;background:transparent;border-radius:7px;min-width:34px;height:34px;padding:0 8px;font-weight:600;white-space:nowrap}.selection-menu button:hover{background:var(--soft)}.selection-menu button:focus-visible,.menu-item:focus-visible{outline:2px solid #737373;outline-offset:-2px}.selection-menu .menu-sep{width:1px;min-width:1px;height:22px;background:var(--line);align-self:center;margin:0 3px}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;padding:0 4px}.mobile-tabs{display:none}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}.install-btn{display:none}
@media(prefers-color-scheme:dark){:root{--bg:#101010;--panel:#1a1a1a;--text:#f5f5f7;--muted:#a0a0a5;--line:#333336;--accent:#f5f5f7;--soft:#29292c;--shadow:0 8px 30px #00000030}.btn.primary{color:#111}.add-button{box-shadow:0 3px 14px #00000060}}
@media(max-width:760px){.topbar{height:56px;padding:0 12px;gap:8px}.brand{font-size:14px;gap:6px}.brand img{width:28px;height:28px}.docname{max-width:115px;font-size:13px}.status{display:none}.topbar .btn{padding:8px;font-size:12px}.workspace{padding:12px;gap:10px}.toolbar{padding:6px;gap:3px;border-radius:12px}.tool{height:32px;min-width:30px;padding:0 7px}.tool-label{display:none}.editor-card{min-height:calc(100dvh - 190px)}.editor-head{height:40px}.editor-area{display:block;min-height:0;flex:1}.pane{height:100%;min-height:400px}.pane+.pane{border:0}.editor{min-height:390px;padding:14px 16px 68px;font-size:14px}.preview{padding:16px;font-size:14px}.mobile-tabs{display:flex;gap:4px;margin-left:auto}.mobile-tabs .btn{padding:6px 10px;font-size:12px}.editor-area.preview-mode .source-pane{display:none}.editor-area.preview-mode .preview-pane{display:flex}.editor-area:not(.preview-mode) .preview-pane{display:none}.footer{font-size:11px}.footer .desktop-only{display:none}}
@media(min-width:761px){.mobile-tabs{display:none}}
@media(max-width:400px){.brand span{display:none}.workspace{padding:8px}.toolbar{overflow-x:auto;flex-wrap:nowrap;max-width:100%;scrollbar-width:thin}.toolbar .top-spacer,.toolbar .tool-label{display:none}.toolbar .toolgroup{flex:0 0 auto}.toolbar .tool{flex:0 0 auto}.docname{max-width:90px;min-width:55px}.topbar .btn{font-size:11px;padding:7px}.editor-head{padding:0 10px}.editor{padding-left:12px;padding-right:12px}.selection-menu{max-width:calc(100vw - 12px)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><img src="./icon.svg" alt=""><span>MD Editor</span></div>
  <input id="docname" class="docname" value="Untitled.md" aria-label="ドキュメント名">
  <div class="top-spacer"></div><span class="status" id="save-status">保存済み</span>
  <button class="btn" id="open-btn" title="Markdownファイルを開く">開く</button><button class="btn" id="download-btn">書き出す</button><button class="btn primary" id="install-btn">インストール</button>
  <input id="file-input" type="file" accept=".md,.markdown,.txt,text/plain" hidden>
</header>
<main class="workspace">
  <nav class="toolbar" aria-label="Markdown書式">
    <div class="toolgroup"><button class="tool" data-prefix="**" data-suffix="**" title="太字 (Ctrl+B)"><b>B</b></button><button class="tool" data-prefix="*" data-suffix="*" title="斜体 (Ctrl+I)"><i>I</i></button><button class="tool" data-prefix="~~" data-suffix="~~" title="取り消し線"><s>S</s></button><button class="tool" data-prefix="`" data-suffix="`" title="インラインコード">⌘</button></div>
    <span class="tool sep">|</span>
    <div class="toolgroup"><button class="tool" data-block="# " title="見出し1">H1</button><button class="tool" data-block="## " title="見出し2">H2</button><button class="tool" data-block="### " title="見出し3">H3</button></div>
    <span class="tool sep">|</span>
    <div class="toolgroup"><button class="tool" data-block="- " title="箇条書き">☷</button><button class="tool" data-block="1. " title="番号付きリスト">1.</button><button class="tool" data-block="- [ ] " title="チェックリスト">☑</button><button class="tool" data-block="> " title="引用">❞</button></div>
    <span class="tool sep">|</span>
    <div class="toolgroup"><button class="tool" data-block="```\n" data-endblock="\n```" title="コードブロック">{ }</button><button class="tool" data-block="[ " data-endblock=" ](https://)" title="リンク">↗</button><button class="tool" data-block="---\n" title="区切り線">―</button></div>
    <div class="top-spacer"></div><span class="tool-label">Markdown</span>
    <div class="mobile-tabs"><button class="btn" id="edit-tab">編集</button><button class="btn" id="preview-tab">プレビュー</button></div>
  </nav>
  <section class="editor-card">
    <div class="editor-head"><span class="tab selected">ドキュメント</span><span class="tab">Markdown</span><div class="top-spacer"></div><button class="btn icon" id="clear-btn" title="内容をクリア">↺</button></div>
    <div class="editor-area" id="editor-area">
      <section class="pane source-pane"><div class="pane-title">Markdown ソース</div><div class="editor-wrap"><textarea id="editor" class="editor" spellcheck="false" autocapitalize="sentences" aria-label="Markdown本文" placeholder="ここから書き始めましょう…"></textarea><div class="add-wrap"><button class="add-button" id="add-button" aria-label="Markdown要素を追加" title="要素を追加">＋</button></div></div></section>
      <section class="pane preview-pane"><div class="pane-title">プレビュー</div><article class="preview" id="preview" aria-live="polite"></article></section>
    </div>
  </section>
  <footer class="footer"><span id="word-count">0 文字</span><span class="desktop-only">端末内に自動保存されます</span><span id="line-count">1 行</span></footer>
</main>
</div>
<div class="add-menu" id="add-menu" role="menu" aria-label="Markdown要素を追加">
<button class="menu-item" data-insert="# ">H1　見出し 1</button><button class="menu-item" data-insert="## ">H2　見出し 2</button><button class="menu-item" data-insert="### ">H3　見出し 3</button><button class="menu-item" data-insert="- ">•　箇条書きリスト</button><button class="menu-item" data-insert="1. ">1.　番号付きリスト</button><button class="menu-item" data-insert="- [ ] ">☐　チェックリスト</button><button class="menu-item" data-insert="> ">❞　引用</button><button class="menu-item" data-insert="```\n\n```"> { }　コードブロック</button><button class="menu-item" data-insert="---\n">―　区切り線</button><button class="menu-item" data-insert="\n">↵　改行</button>
</div>
<div class="selection-menu" id="selection-menu" role="toolbar" aria-label="選択したテキストの操作">
<button data-action="cut" title="切り取り">切り取り</button><button data-action="copy" title="コピー">コピー</button><button data-action="paste" title="貼り付け">貼り付け</button><span class="menu-sep"></span><button data-wrap="**" title="太字"><b>B</b></button><button data-wrap="*" title="斜体"><i>I</i></button><button data-wrap="~~" title="取り消し線"><s>S</s></button><button data-line="# " title="見出し1">H1</button><button data-line="## " title="見出し2">H2</button><button data-line="### " title="見出し3">H3</button><button data-line="- " title="リスト">☷</button><button data-line="> " title="引用">❞</button>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=> {
const $=s=>document.querySelector(s), editor=$('#editor'), preview=$('#preview'), area=$('#editor-area');
const addMenu=$('#add-menu'), addButton=$('#add-button'), selectMenu=$('#selection-menu');
let savedSelection=null, toastTimer, saveTimer, deferredInstall=null, isDirty=false;
const KEY='md-editor-document-v1', NAMEKEY='md-editor-name-v1';
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function inlineMarkdown(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/_(.+?)_/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function renderMarkdown(md){
const lines=md.split('\n');let out=[],list=null,code=false,codeLines=[],quote=[];
const closeList=()=>{if(list){out.push('</'+list+'>');list=null}};
const closeQuote=()=>{if(quote.length){out.push('<blockquote>'+quote.map(x=>'<p>'+inlineMarkdown(x)+'</p>').join('')+'</blockquote>');quote=[]}};
const closeCode=()=>{if(code){out.push('<pre><code>'+escapeHtml(codeLines.join('\n'))+'</code></pre>');code=false;codeLines=[]}};
for(const line of lines){
if(line.trim().startsWith('```')){closeList();closeQuote();if(code)closeCode();else{code=true;codeLines=[]}continue}
if(code){codeLines.push(line);continue}
const h=line.match(/^(#{1,6})\s+(.+)$/);if(h){closeList();closeQuote();const n=h[1].length;out.push('<h'+n+'>'+inlineMarkdown(h[2])+'</h'+n+'>');continue}
if(/^\s*([-*_]\s*){3,}$/.test(line)){closeList();closeQuote();out.push('<hr>');continue}
if(/^>\s?/.test(line)){closeList();quote.push(line.replace(/^>\s?/,'').trim());continue}else closeQuote();
const ul=line.match(/^\s*[-*+]\s+(.+)$/),ol=line.match(/^\s*\d+\.\s+(.+)$/),task=line.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.+)$/);
if(ul||ol){const type=ol?'ol':'ul';if(list!==type){closeList();out.push('<'+type+'>');list=type}if(task){out.push('<li class="task"><input type="checkbox" disabled '+(task[1].toLowerCase()==='x'?'checked':'')+'> '+inlineMarkdown(task[2])+'</li>')}else out.push('<li>'+inlineMarkdown((ul||ol)[1])+'</li>');continue}
closeList();if(!line.trim()){out.push('');continue}out.push('<p>'+inlineMarkdown(line)+'</p>');
}
closeList();closeQuote();closeCode();return out.join('\n')||'<p style="color:var(--muted)">プレビューがここに表示されます。</p>';
}
function update(){preview.innerHTML=renderMarkdown(editor.value);$('#word-count').textContent=editor.value.length.toLocaleString()+' 文字';$('#line-count').textContent=(editor.value.split('\n').length).toLocaleString()+' 行';isDirty=true;$('#save-status').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,editor.value);localStorage.setItem(NAMEKEY,$('#docname').value);$('#save-status').textContent='保存済み';isDirty=false}catch(e){$('#save-status').textContent='保存できません'}},250)}
function getSelection(){return {start:editor.selectionStart,end:editor.selectionEnd,text:editor.value.slice(editor.selectionStart,editor.selectionEnd)}}
function insertAtSelection(text,selectStart=0,selectEnd=0){const s=getSelection();editor.setRangeText(text,s.start,s.end,'end');editor.focus();if(selectEnd>selectStart)editor.setSelectionRange(s.start+selectStart,s.start+selectEnd);update()}
function wrapSelection(mark){const s=getSelection();if(s.start===s.end){insertAtSelection(mark+mark,mark.length,mark.length);return}insertAtSelection(mark+s.text+mark,mark.length,mark.length+s.text.length)}
function prefixLine(prefix){const s=getSelection(),start=editor.value.lastIndexOf('\n',s.start-1)+1,end0=editor.value.indexOf('\n',s.end),end=end0<0?editor.value.length:end0,chunk=editor.value.slice(start,end);const changed=chunk.split('\n').map(l=>prefix+l).join('\n');editor.setRangeText(changed,start,end,'select');editor.focus();update()}
function hideMenus(){addMenu.classList.remove('open');selectMenu.classList.remove('open')}
function positionMenu(el,x,y){el.style.left='8px';el.style.top='8px';const r=el.getBoundingClientRect(),left=Math.max(8,Math.min(innerWidth-r.width-8,x-r.width/2)),top=Math.max(8,Math.min(innerHeight-r.height-8,y-r.height-10));el.style.left=left+'px';el.style.top=top+'px'}
function showSelectionMenu(){const s=getSelection();if(s.start===s.end||document.activeElement!==editor){selectMenu.classList.remove('open');return}savedSelection={start:s.start,end:s.end};selectMenu.classList.add('open');let x=innerWidth/2,y=130;try{const pos=editor.selectionStart,txt=editor.value.slice(0,pos),line=txt.split('\n').length-1,tail=txt.split('\n').pop();const rect=editor.getBoundingClientRect(),lineHeight=parseFloat(getComputedStyle(editor).lineHeight)||26;x=Math.min(innerWidth-130,Math.max(130,rect.left+Math.min(rect.width-40,tail.length*8)));y=rect.top+Math.min(rect.height-20,20+line*lineHeight-editor.scrollTop)}catch{}positionMenu(selectMenu,x,y)}
function restoreSelection(){if(savedSelection){editor.focus();editor.setSelectionRange(savedSelection.start,savedSelection.end)}}
editor.addEventListener('contextmenu',e=>e.preventDefault());editor.addEventListener('input',update);editor.addEventListener('select',()=>{clearTimeout(window._selTimer);window._selTimer=setTimeout(showSelectionMenu,80)});editor.addEventListener('keyup',e=>{if(['Shift','Control','Alt','Meta','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))showSelectionMenu()});editor.addEventListener('mouseup',()=>setTimeout(showSelectionMenu,30));editor.addEventListener('touchend',()=>setTimeout(showSelectionMenu,250));editor.addEventListener('scroll',()=>selectMenu.classList.remove('open'));
document.addEventListener('pointerdown',e=>{if(!selectMenu.contains(e.target)&&!addMenu.contains(e.target)&&e.target!==addButton){selectMenu.classList.remove('open');if(!addMenu.contains(e.target))addMenu.classList.remove('open')}});
document.querySelectorAll('[data-prefix]').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));document.querySelectorAll('[data-prefix]').forEach(b=>b.addEventListener('click',()=>{editor.focus();wrapSelection(b.dataset.prefix)}));
document.querySelectorAll('[data-block]').forEach(b=>b.addEventListener('click',()=>{editor.focus();if(b.dataset.endblock){const s=getSelection(),t=s.text||'コード';insertAtSelection(b.dataset.block+t+b.dataset.endblock,b.dataset.block.length,b.dataset.block.length+t.length)}else prefixLine(b.dataset.block.replace(/\\n/g,'\n'))}));
addButton.addEventListener('click',e=>{e.stopPropagation();const open=addMenu.classList.toggle('open');selectMenu.classList.remove('open');if(open){const r=addButton.getBoundingClientRect();addMenu.style.left=Math.max(8,Math.min(innerWidth-205,r.left-75))+'px';addMenu.style.top=Math.max(8,r.top-addMenu.offsetHeight-8)+'px'}});
addMenu.querySelectorAll('[data-insert]').forEach(b=>b.addEventListener('click',()=>{editor.focus();let val=b.dataset.insert.replace(/\\n/g,'\n');const s=getSelection();if(val==='# '||val==='## '||val==='### '||val==='- '||val==='1. '||val==='- [ ] '||val==='> '){prefixLine(val)}else{insertAtSelection(val);if(val==='```\\n\\n```'){const p=editor.selectionStart-4;editor.setSelectionRange(Math.max(0,p),Math.max(0,p));}}hideMenus()}));
selectMenu.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{restoreSelection();const s=getSelection();try{if(b.dataset.action==='copy'){await navigator.clipboard.writeText(s.text);toast('コピーしました')}if(b.dataset.action==='cut'){await navigator.clipboard.writeText(s.text);editor.setRangeText('',s.start,s.end,'start');update();toast('切り取りました')}if(b.dataset.action==='paste'){const t=await navigator.clipboard.readText();insertAtSelection(t);toast('貼り付けました')}}catch{toast('クリップボードを利用できません。ブラウザーの権限をご確認ください')}selectMenu.classList.remove('open')}));
selectMenu.querySelectorAll('[data-wrap]').forEach(b=>b.addEventListener('click',()=>{restoreSelection();wrapSelection(b.dataset.wrap);selectMenu.classList.remove('open')}));
selectMenu.querySelectorAll('[data-line]').forEach(b=>b.addEventListener('click',()=>{restoreSelection();prefixLine(b.dataset.line);selectMenu.classList.remove('open')}));
$('#open-btn').addEventListener('click',()=>$('#file-input').click());
$('#file-input').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;editor.value=await f.text();$('#docname').value=f.name;update();toast('ファイルを開きました');e.target.value=''});
$('#download-btn').addEventListener('click',()=>{const name=($('#docname').value.trim()||'Untitled.md').replace(/[\\/:*?"<>|]/g,'_');const blob=new Blob([editor.value],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.endsWith('.md')?name:name+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Markdownを書き出しました')});
$('#clear-btn').addEventListener('click',()=>{if(!editor.value||confirm('本文をすべて削除しますか？')){editor.value='';update();editor.focus()}});
$('#docname').addEventListener('input',()=>{try{localStorage.setItem(NAMEKEY,$('#docname').value);$('#save-status').textContent='保存済み'}catch{$('#save-status').textContent='保存できません'}});
$('#edit-tab').addEventListener('click',()=>area.classList.remove('preview-mode'));$('#preview-tab').addEventListener('click',()=>area.classList.add('preview-mode'));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();wrapSelection('**')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='i'){e.preventDefault();wrapSelection('*')}if(e.key==='Escape')hideMenus()});
try{editor.value=localStorage.getItem(KEY)||'# はじめましょう\n\nMD Editorへようこそ。\n\n- テキストを選択して書式を変更\n- **太字** や *斜体* を使う\n- ＋ボタンから要素を追加\n\n気軽に書き始めてください。';$('#docname').value=localStorage.getItem(NAMEKEY)||'Untitled.md'}catch{editor.value='# はじめましょう'}
update();isDirty=false;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#install-btn').style.display='inline-flex'});$('#install-btn').addEventListener('click',async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null}else toast('ブラウザーのメニューから「ホーム画面に追加」を選択してください')});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
